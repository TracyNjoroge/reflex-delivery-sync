<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex - Dispatch & Rider Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto space-y-8">
        <!-- 1. Dispatcher / Retailer Portal -->
        <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-lg font-bold">Inbound Requests (Retailer)</h2>
                    <p class="text-xs text-slate-400">Waiting for dispatch</p>
                </div>
                <button onclick="injectMockOrder()" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">+ Simulate Order</button>
            </div>
            <div id="deliveries-list" class="space-y-3"></div>
        </div>

        <!-- 2. Rider Portal (Juma Pikipiki / rider_01) -->
        <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-bold mb-1 text-emerald-400">🏍️ Rider Portal (Juma - rider_01)</h2>
            <p class="text-xs text-slate-400 mb-4">Assigned trips syncing in real time</p>
            <div id="rider-list" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwtJj_eRuROtBoLdek-TLxLqRC4lOc3cM",
            authDomain: "reflex-779d1.firebaseapp.com",
            databaseURL: "https://reflex-779d1-default-rtdb.firebaseio.com",
            projectId: "reflex-779d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Retailer places a new request
        window.injectMockOrder = () => {
            const newRef = push(ref(db, 'deliveries'));
            set(newRef, {
                id: newRef.key,
                customerName: "Amina Mohamed",
                address: "Moi Avenue, Shop #4",
                status: "REQUESTED",
                riderId: null
            });
        };

        // Dispatcher assigns the trip to Juma (rider_01)
        window.assignDelivery = (id) => {
            update(ref(db, `deliveries/${id}`), {
                riderId: "rider_01",
                status: "ASSIGNED"
            });
        };

        // Rider marks the trip as completed
        window.completeDelivery = (id) => {
            update(ref(db, `deliveries/${id}`), { status: "DELIVERED" });
        };

        // Sync both views simultaneously 
        onValue(ref(db, 'deliveries'), (snapshot) => {
            const data = snapshot.val() || {};
            const items = Object.values(data);

            // Filter for Dispatcher (New requests)
            const requested = items.filter(d => d.status === "REQUESTED");
            document.getElementById('deliveries-list').innerHTML = requested.length ? requested.map(d => `
                <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-800">
                    <div><p class="font-bold">${d.customerName}</p><p class="text-xs text-slate-400">📍 ${d.address}</p></div>
                    <button onclick="assignDelivery('${d.id}')" class="bg-slate-100 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg">Assign to Juma</button>
                </div>
            `).join('') : '<p class="text-slate-500 text-xs">No active requests.</p>';

            // Filter for Rider Juma (Assigned to rider_01)
            const riderJobs = items.filter(d => d.status === "ASSIGNED" && d.riderId === "rider_01");
            document.getElementById('rider-list').innerHTML = riderJobs.length ? riderJobs.map(d => `
                <div class="bg-emerald-950/20 p-4 rounded-xl flex justify-between items-center border border-emerald-500/20">
                    <div><p class="font-bold text-emerald-300">${d.customerName}</p><p class="text-xs text-slate-400">Deliver to: ${d.address}</p></div>
                    <button onclick="completeDelivery('${d.id}')" class="bg-emerald-500 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg">Complete Job</button>
                </div>
            `).join('') : '<p class="text-slate-500 text-xs">No active deliveries assigned.</p>';
        });
    </script>
</body>
</html>
