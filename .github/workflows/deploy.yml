name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run build script
        run: npm run build
        continue-on-error: true

      - name: Deploy to Firebase Hosting (with Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REFLEX != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REFLEX }}
          channelId: live
          projectId: reflex-779d1

      - name: Deploy to Firebase Hosting (fallback - CLI login)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REFLEX == '' }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project reflex-779d1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
