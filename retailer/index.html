<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex - Retailer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6 min-h-screen">
  <div class="max-w-xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-slate-900">🛒 Retailer Portal</h1>
        <span id="count" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">0 Orders</span>
      </div>
      <!-- Back Button -->
      <a href="../index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-4 py-2 rounded-xl transition">
        ⬅ Back to Home
      </a>
    </div>

    <!-- Create Request Form -->
    <form id="form" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="font-bold text-xs text-slate-400 uppercase tracking-wider">New Delivery Request</h2>
      <div class="grid grid-cols-2 gap-3">
        <input type="text" name="customerName" placeholder="Customer Name" required class="p-2 border rounded-lg text-sm w-full">
        <input type="tel" name="phone" placeholder="Phone Number" required class="p-2 border rounded-lg text-sm w-full">
      </div>
      <input type="text" name="address" placeholder="Delivery Address" required class="w-full p-2 border rounded-lg text-sm">
      <input type="text" name="item" placeholder="Item Description" required class="w-full p-2 border rounded-lg text-sm">
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Create Delivery</button>
    </form>

    <!-- Sent Deliveries Status -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="font-bold text-xs text-slate-400 uppercase tracking-wider">Sent Requests</h2>
      <div id="list" class="space-y-3"></div>
    </div>
  </div>

  <script type="module">
    // Imported "set" to fix the double push bug
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const db = getDatabase(initializeApp({
      databaseURL: "https://reflex-779d1-default-rtdb.firebaseio.com"
    }));

    // Form Submit Handler
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      
      const newRef = push(ref(db, "deliveries")); // Generates the correct key
      const newObj = {
        id: newRef.key,
        customerName: fd.get("customerName"),
        phone: fd.get("phone"),
        address: fd.get("address"),
        itemDescription: fd.get("item"),
        status: "REQUESTED",
        riderId: null,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      
      set(newRef, newObj); // Writes directly to the generated key (FIX)
      e.currentTarget.reset();
    });

    // Real-Time Listener
    onValue(ref(db, "deliveries"), (snapshot) => {
      const data = snapshot.val() || {};
      const list = Object.values(data).sort((a,b) => b.createdAt - a.createdAt);
      
      document.getElementById("count").textContent = `${list.length} Orders`;
      document.getElementById("list").innerHTML = list.length ? list.map(d => `
        <div class="p-3 bg-slate-50 border border-slate-100 rounded-lg flex justify-between items-center text-sm">
          <div>
            <p class="font-bold text-slate-800">${d.customerName}</p>
            <p class="text-xs text-slate-500">📍 ${d.address}</p>
          </div>
          <span class="text-[10px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wide ${
            d.status === 'DELIVERED' ? 'bg-green-100 text-green-800' :
            d.status === 'ASSIGNED' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
          }">${d.status}</span>
        </div>
      `).join('') : '<p class="text-slate-400 text-xs">No sent requests.</p>';
    });
  </script>
</body>
</html>
