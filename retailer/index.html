<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reflex - Delivery View</title>
  <style>
    :root { --bg: #f5f7fb; --panel: #fff; --text: #1f2937; --muted: #6b7280; --primary: #2563eb; --border: #e5e7eb; --shadow: 0 10px 24px rgba(15,23,42,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 1100px; margin: 40px auto; padding: 24px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 2rem; }
    .status-chip { display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: .75rem; font-weight: 700; text-transform: uppercase; background: #dbeafe; color: #1d4ed8; }
    .status-chip.assigned { background: #dbeafe; color: #1d4ed8; }
    .status-chip.requested { background: #fef3c7; color: #92400e; }
    .status-chip.delivered { background: #dcfce7; color: #166534; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .delivery-item { background: #f9fafb; border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .delivery-item h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .meta { display: grid; gap: 8px; color: var(--muted); font-size: .96rem; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Reflex Delivery View</h1>
      <span id="countBadge" class="status-chip assigned">0 deliveries</span>
    </div>

    <form id="deliveryForm" class="card" style="display:grid; gap:12px; max-width:700px;">
      <h2 style="margin:0">Create Delivery Request</h2>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
        <input type="text" name="customerName" placeholder="Customer name" required style="padding:10px; border:1px solid var(--border); border-radius:8px;">
        <input type="tel" name="phone" placeholder="Phone" required style="padding:10px; border:1px solid var(--border); border-radius:8px;">
      </div>
      <input type="text" name="address" placeholder="Address" required style="padding:10px; border:1px solid var(--border); border-radius:8px;">
      <input type="text" name="itemDescription" placeholder="Item description" required style="padding:10px; border:1px solid var(--border); border-radius:8px;">
      <button type="submit" style="padding:12px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; cursor:pointer">Create Delivery</button>
    </form>

    <div class="card" style="max-width:700px;">
      <h2 style="margin-top:0">Delivery Completion Scan</h2>
      <div id="reader" style="width:100%; max-width:420px; margin:0 auto;"></div>
      <div id="scanStatus" style="margin-top:12px; color:var(--muted);">Scan a delivery ID QR code to mark it as delivered.</div>
    </div>

    <div id="app" class="card"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const config = {
      apiKey: "AIzaSyAwtJj_eRuROtBoLdek-TLxLqRC4lOc3cM",
      authDomain: "reflex-779d1.firebaseapp.com",
      databaseURL: "https://reflex-779d1-default-rtdb.firebaseio.com",
      projectId: "reflex-779d1",
      storageBucket: "reflex-779d1.firebasestorage.app",
      messagingSenderId: "863266679437",
      appId: "1:863266679437:web:48ae4e8889632a7391d0c4",
      measurementId: "G-QRW0KBDJR6"
    };

    const app = initializeApp(config), db = getDatabase(app);
    const appRoot = document.getElementById("app"), countBadge = document.getElementById("countBadge"), deliveryForm = document.getElementById("deliveryForm"), scanStatus = document.getElementById("scanStatus");

    const assignRider = (id, rId) => update(ref(db), { [`/deliveries/${id}/riderId`]: rId, [`/deliveries/${id}/status`]: "ASSIGNED", [`/deliveries/${id}/updatedAt`]: Date.now() });
    const updateStatus = (id, s) => {
      update(ref(db), { [`/deliveries/${id}/status`]: s, [`/deliveries/${id}/updatedAt`]: Date.now() });
      scanStatus.textContent = `Delivery ${id} marked as ${s}.`;
    };

    const createDelivery = (name, phone, addr, desc) => {
      const newRef = push(ref(db, "deliveries"));
      set(newRef, { id: newRef.key, customerName: name, phone, address: addr, itemDescription: desc, status: "REQUESTED", riderId: null, createdAt: Date.now(), updatedAt: Date.now() });
    };

    const render = (list) => {
      if (!list || !list.length) return appRoot.innerHTML = '<div class="empty">No deliveries found.</div>', countBadge.textContent = "0 deliveries";
      appRoot.innerHTML = `<div class="grid">${list.map(d => `
        <div class="delivery-item">
          <h2>${d.id}</h2>
          <div class="meta">
            <strong>${d.customerName}</strong><span>${d.phone}</span><span>${d.address}</span><span>${d.itemDescription}</span>
            <span><span class="status-chip ${d.status?.toLowerCase().replace(/_/g, "-")}">${d.status}</span></span>
            <span>Rider: ${d.riderId || "Unassigned"}</span>
            <span>Created: ${new Date(d.createdAt).toLocaleString()}</span>
            <label style="display:flex; align-items:center; gap:8px; margin-top:8px;">
              <span>Assign:</span>
              <select data-id="${d.id}" style="padding:6px; border-radius:6px; border:1px solid var(--border)">
                <option value="">Select rider</option>
                <option value="rider_01" ${d.riderId==="rider_01"?"selected":""}>rider_01</option>
                <option value="rider_02" ${d.riderId==="rider_02"?"selected":""}>rider_02</option>
              </select>
            </label>
          </div>
        </div>`).join("")}</div>`;
      countBadge.textContent = `${list.length} delivery${list.length > 1 ? "ies" : "y"}`;
      appRoot.querySelectorAll("select[data-id]").forEach(s => s.addEventListener("change", e => assignRider(e.target.dataset.id, e.target.value)));
    };

    onValue(ref(db, "deliveries"), s => render(s.val() ? Object.values(s.val()).sort((a, b) => b.createdAt - a.createdAt) : []));

    deliveryForm.addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      createDelivery(fd.get("customerName"), fd.get("phone"), fd.get("address"), fd.get("itemDescription"));
      e.currentTarget.reset();
    });

    if (window.Html5QrcodeScanner) {
      const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      scanner.render(text => { updateStatus(text.trim(), "DELIVERED"); scanner.clear().catch(()=>{}); });
    }
  </script>
</body>
</html>
