<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Rider - Delivery Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <!-- Top App Bar with Integrated Back Button -->
    <nav class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xl">REFLEX</div>
            <span class="text-xs font-bold text-slate-400 uppercase hidden sm:inline pl-3 border-l border-slate-800">Rider Dashboard</span>
        </div>
        <a href="../index.html" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
            ⬅ Back to Home
        </a>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <div class="flex justify-between items-center bg-slate-950 p-5 border border-slate-800 rounded-2xl">
            <div>
                <h1 class="text-xl font-bold tracking-tight">My Active Deliveries</h1>
                <p class="text-xs text-slate-400 mt-1">Real-time driver assignments for <strong>rider_01</strong></p>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
            </span>
        </div>

        <div id="deliveries-list" class="space-y-4"></div>
        <div id="empty-state" class="hidden bg-slate-950 border border-slate-800 border-dashed rounded-2xl p-12 text-center text-slate-500">
            <p class="text-sm font-medium text-slate-400">🏍️ No active deliveries assigned.</p>
        </div>
    </main>

    <script type="module">
        import { db, ref, onValue, update } from "../firebase.js";

        const RIDER_ID = "rider_01";
        const listContainer = document.getElementById("deliveries-list");
        const emptyState = document.getElementById("empty-state");

        onValue(ref(db, "deliveries"), (snapshot) => {
            const deliveries = snapshot.val();
            listContainer.innerHTML = "";

            if (!deliveries) {
                emptyState.classList.remove("hidden");
                return;
            }

            let activeCount = 0;

            // We loop with Object.entries to safely fetch the key
            Object.entries(deliveries).forEach(([key, delivery]) => {
                const deliveryId = delivery.id || key; // Fixes the "undefined" ID issue
                const status = delivery.status || "UNKNOWN";

                if (delivery.riderId !== RIDER_ID || status === "DELIVERED" || status === "UNKNOWN") return;

                activeCount++;

                const buttonText = status === "ASSIGNED" ? "Mark as Picked Up" : "Mark as Delivered";
                const buttonClass = status === "ASSIGNED" ? "bg-amber-500 text-slate-950 hover:bg-amber-400" : "bg-emerald-500 text-slate-950 hover:bg-emerald-400";

                const card = document.createElement("div");
                card.className = "bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-md";
                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <span class="text-[10px] font-extrabold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">${deliveryId}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">${status}</span>
                        </div>
                        <h2 class="font-bold text-lg text-slate-100">${delivery.customerName || "N/A"}</h2>
                        <p class="text-xs text-slate-400">📍 Address: ${delivery.address || "No Address Provided"}</p>
                        <p class="text-xs text-slate-500">📱 Mobile: ${delivery.phone || "N/A"} • Item: ${delivery.itemDescription || "N/A"}</p>
                    </div>
                    <button class="status-button ${buttonClass} font-bold text-xs px-4 py-2.5 rounded-xl transition active:scale-95 w-full sm:w-auto" data-id="${deliveryId}" data-status="${status}">
                        ${buttonText}
                    </button>
                `;
                listContainer.appendChild(card);
            });

            activeCount === 0 ? emptyState.classList.remove("hidden") : emptyState.classList.add("hidden");
        });

        // Event delegation for the status update button
        listContainer.addEventListener("click", async (e) => {
            if (!e.target.classList.contains("status-button")) return;
            const btn = e.target;
            const deliveryId = btn.dataset.id;
            const nextStatus = btn.dataset.status === "ASSIGNED" ? "PICKED_UP" : "DELIVERED";

            await update(ref(db, `deliveries/${deliveryId}`), {
                status: nextStatus,
                updatedAt: Date.now()
            });
        });
    </script>
</body>
</html>
